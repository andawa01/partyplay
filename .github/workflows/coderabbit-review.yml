name: Request CodeRabbit review

# CodeRabbit's open-source plan only reviews public repositories with 10 or more
# stars automatically. Below that threshold every review has to be requested, and
# no `.coderabbit.yaml` setting changes it. Posting the documented command as the
# workflow bot counts as a request, so reviews still start without a human step.
#
# Add `synchronize` to the types below if each push should be reviewed too: that
# spends one request per push, and requests are rate limited.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coderabbit-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    name: Request review
    # Opened drafts wait for ready_for_review, which fires below.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment the review command once
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const command = "@coderabbitai review";

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            // A reopen or ready-for-review transition must not stack requests.
            const requested = comments.some(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(command),
            );
            if (requested) {
              core.info("Review already requested on this pull request.");
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: command,
            });
            core.info(`Posted ${command}`);
